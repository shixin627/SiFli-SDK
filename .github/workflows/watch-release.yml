name: Watch Release

# Runs the whole release flow on the bench PC (self-hosted runner):
# RELEASE mode + version -> Keil build -> package -> flash the watch ->
# board screening (UART) -> BLE 配號 + 連線測試 -> upload to Aliyun OSS.
#
# The BLE step assigns a new MAC and then verifies advertising + GATT. Signal
# strength is not gated: the RSSI threshold is pinned to the weakest value the
# helper accepts, so a weak-but-working watch still passes.
#
# There is deliberately no actions/checkout: the toolchain (SiFli env, Keil),
# the watch fixture and the OSS credentials all live in the working tree at
# WATCH_REPO, and a fresh clone would rebuild ~2.5 MB of firmware from zero.
# The commit that was actually released is recorded in the run summary.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "發布版號 X.Y.Z（留空 = OSS 上最新版號 +1）"
        default: ""
      board:
        description: "晶片型號"
        type: choice
        default: sf32lb56-watch
        options: [sf32lb56-watch, sf32lb56w-watch]
      notes:
        description: "發布介紹（info.json description）"
        default: ""
      with_watchface:
        description: "包含錶面 watchface"
        type: boolean
        default: false
      flash:
        # An explicit boolean, not "leave flash_port empty": gh drops empty
        # -f values and falls back to the default, which would flash a watch
        # on a run that was meant to be build-only.
        description: "刷機並做實機測試（取消勾選 = 只編譯打包）"
        type: boolean
        default: true
      flash_port:
        description: "燒錄 COM（boot ROM download）"
        default: "COM4"
      hcpu_port:
        description: "HCPU 篩檢/下指令 COM"
        default: "COM3"
      skip_hwtest:
        description: "刷機後跳過板級篩檢與 BLE 測試"
        type: boolean
        default: false
      upload:
        description: "上傳 info.json + watchOS.zip 到阿里雲 OSS"
        type: boolean
        default: false

# One watch, one set of COM ports: never let two releases run at once.
concurrency:
  group: watch-bench
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, windows, watch-bench]
    timeout-minutes: 60
    env:
      WATCH_REPO: C:\skaiwalk\SiFli-SDK
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Record working tree state
        working-directory: ${{ env.WATCH_REPO }}
        run: |
          $sha = git rev-parse HEAD
          $dirty = git status --short
          "## Watch release ${{ inputs.version }} (${{ inputs.board }})" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- commit: ``$sha``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($dirty) {
            "- working tree is DIRTY:" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' + "`n$dirty`n" + '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Build, flash, test and publish
        working-directory: ${{ env.WATCH_REPO }}\example\get-started\dualcore\project\hcpu
        # Inputs come in as env vars, never interpolated into the script text:
        # a quote in `notes` would otherwise break out of the PowerShell string.
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BOARD: ${{ inputs.board }}
          IN_NOTES: ${{ inputs.notes }}
          IN_FLASH_PORT: ${{ inputs.flash_port }}
          IN_HCPU_PORT: ${{ inputs.hcpu_port }}
        run: |
          # Built as an array: PowerShell 5.1 silently drops empty-string
          # arguments to native programs, so optional values are appended
          # only when they actually have content.
          $argv = @('release_ci.py', '--board', $env:IN_BOARD)
          if ($env:IN_VERSION) { $argv += @('--version', $env:IN_VERSION) }
          if ($env:IN_NOTES)   { $argv += @('--notes', $env:IN_NOTES) }
          if ('${{ inputs.with_watchface }}' -eq 'true') { $argv += '--with-watchface' }
          if ('${{ inputs.flash }}' -eq 'true') {
            $argv += @('--flash-port', $env:IN_FLASH_PORT,
                       '--hcpu-port', $env:IN_HCPU_PORT)
          }
          if ('${{ inputs.skip_hwtest }}' -eq 'true') { $argv += '--skip-hwtest' }
          if ('${{ inputs.upload }}'      -eq 'true') { $argv += '--upload' }
          Write-Host "release_ci.py args: $($argv -join ' ')"
          py -3 @argv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-${{ inputs.version }}-${{ inputs.board }}
          if-no-files-found: warn
          path: |
            ${{ env.WATCH_REPO }}\example\get-started\dualcore\project\hcpu\watchOS.zip
            ${{ env.WATCH_REPO }}\example\get-started\dualcore\project\hcpu\info.json
            ${{ env.WATCH_REPO }}\example\get-started\dualcore\project\hcpu\_watch_build.log
