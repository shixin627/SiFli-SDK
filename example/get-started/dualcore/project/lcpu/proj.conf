CONFIG_BSP_USING_TIM=y
# CONFIG_RT_USING_FINSH is not set
CONFIG_BSP_USING_LPTIM2=y
# CONFIG_BSP_USING_SPI is not set
# CONFIG_RT_USING_DFS is not set
CONFIG_BSP_USING_WDT=y
CONFIG_WDT_TIMEOUT=10
CONFIG_RT_MAIN_THREAD_STACK_SIZE=1536
CONFIG_FINSH_THREAD_STACK_SIZE=1024
CONFIG_RT_USING_HWMAILBOX=y
CONFIG_RT_USING_RTC=y
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_USING_ISR_LOG=y
# CONFIG_ULOG_USING_COLOR is not set
CONFIG_RT_TICK_PER_SECOND=1000
CONFIG_IDLE_THREAD_STACK_SIZE=1024
CONFIG_RT_TIMER_THREAD_STACK_SIZE=1024
CONFIG_RT_USING_MEMHEAP=y
CONFIG_RT_USING_MEMTRACE=y
CONFIG_RT_CONSOLEBUF_SIZE=256
CONFIG_BLUETOOTH=y
CONFIG_BT_DUAL_FULL_MEM=y
# CONFIG_BSP_BLE_SIBLES is not set
CONFIG_ROM_LOG_PORT="uart4"
# Enable LCPU PM so the SoC can deep-sleep between events. Combined with
# USE_BMI270_HW_WRIST_WAKE=1 (src/lcpu/main.c) and the wear-gated PPG,
# nothing periodic should keep LCPU awake — wake sources are button INT,
# BMI270 INT1 (wrist-wake), charger INT, and BLE controller's own timer.
# NOTE: this is the first time PM is enabled on this LCPU build. Validate
# carefully — if anything misbehaves the safest revert is to comment this
# line back out.
CONFIG_BSP_USING_PM=y
CONFIG_BSP_USING_DATA_SVC=y
CONFIG_USING_BUTTON_LIB=y
CONFIG_BUTTON_SERVICE_ENABLED=n
CONFIG_USING_IPC_QUEUE=y
CONFIG_AUDIO=y
CONFIG_AUDIO_PATH_USING_HCPU=y
CONFIG_BSP_USING_I2C=y
CONFIG_BSP_USING_I2C5=y
CONFIG_BSP_USING_PWM=y
CONFIG_BSP_USING_PWM4=y
CONFIG_BSP_PWM4_UPDATE_USING_DMA=y
CONFIG_BSP_USING_ADC=y
CONFIG_BSP_USING_ADC1=y
CONFIG_BSP_USING_CHARGER=y
CONFIG_CHARGE_USING_SIMPLE_CHARGE=y
CONFIG_CHARGE_PIN_CONFIG=y
CONFIG_BSP_CHARGER_INT_PIN=130
CONFIG_BSP_USING_CHARGER_DETECT=y
CONFIG_USING_BATTERY_CALCULATOR=y
CONFIG_BSP_USING_ONCHIP_RTC=y
CONFIG_BSP_USING_MOTOR=y
CONFIG_MOTOR_ENABLED=y
CONFIG_MOTOR_USE_PWM=y
CONFIG_MOTOR_INTERFACE_NAME="pwm4"
CONFIG_MOTOR_CHANEL_NUM=3
CONFIG_MOTOR_PERIOD=4
CONFIG_MOTOR_POWER_IO=5
CONFIG_HR_USING_GH3018=y
# GH3018 power pin 161
CONFIG_GH3018_POW_PIN=161
CONFIG_SENSOR_USING_6D=y
# CONFIG_GSENSOR_UES_FIFO is not set
CONFIG_BMI270_INT_GPIO_BIT=122
CONFIG_BMI270_INT2_GPIO_BIT=0
# BMI270 power pin 118
CONFIG_BMI270_POW_PIN=118
# Kraepelin SW step / sleep / activity algorithm — replaced by BMI270's
# on-chip step counter. The corresponding source dirs (activity/ and
# external/Kraepelin/) won't be compiled or linked, saving ~tens of KB
# of code. Re-enable by uncommenting if you ever need SW VMC / sleep
# tracking. INIT_APP_EXPORT(activity_main) is also commented out, so
# even with these enabled the service doesn't auto-start.
# CONFIG_PKG_USING_KRAEPELIN is not set
# CONFIG_PKG_USING_KRAEPELIN_REFERENCE is not set
# helper_worker.h pulls in constants_worker.h from Kraepelin reference;
# nothing else in the project uses helper_worker, so disable together.
# CONFIG_PKG_USING_HELPER_WORKER is not set
CONFIG_BSP_USING_MAHONY_AHRS=y
CONFIG_BSP_USING_HAND_TRACKING=y
CONFIG_BSP_USING_GESTURE_DETECT=y
# CONFIG_BSP_USING_ACTIVITY_ALGO_KRAEPELIN is not set
# In-tree sleep classifier (Cole-Kripke + HR staging). Pure C, runs on
# LCPU, fuses BMI270 accel with GH3018 PPG-HR. Emits stage transitions
# via watch_sys_sync.notify_sleep_state -> HCPU. See
# src/modules/algorithm/health/sleep_fusion.{c,h} and
# src/modules/service/sleep_service.c.
# CONFIG_BSP_USING_SLEEP_FUSION=y
CONFIG_BSP_USING_WEAR_DETECT=y
CONFIG_BSP_USING_BLOC=y
CONFIG_BSP_USING_BLOC_MOTOR=y
CONFIG_BSP_USING_BLOC_BATTERY=y
CONFIG_BSP_USING_BLOC_PERIPHERAL=y
CONFIG_BSP_USING_HR_SVC=y
CONFIG_BSP_USING_ACCE_SVC=y
# CONFIG_BSP_USING_BARO_SVC=y
# CONFIG_SENSOR_USING_BAROMETER=y
# CONFIG_SENSOR_USING_SPL06=y
CONFIG_BSP_USING_WATCHSYS_SVC=y
CONFIG_BSP_USING_VIRTUAL_CONSOLE=y