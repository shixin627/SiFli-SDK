CONFIG_LCD_WINDOWS=y
# Match physical sf32lb56w-watch screen (466x466 round AMOLED). LV_RES_AUTO
# falls back to 368x448 (portrait) when LCD_HOR_RES_MAX isn't defined for PC.
# CONFIG_LV_RES_AUTO is not set
CONFIG_LV_HOR_RES_MAX=466
CONFIG_LV_VER_RES_MAX=466
CONFIG_RT_USING_POSIX=n
CONFIG_RT_USING_USER_MAIN=n
CONFIG_RT_USING_HWMAILBOX=n
CONFIG_USING_BUTTON_LIB=n
# tshell: FINSH/MSH on, so Claude/dev can drive PC sim via main.exe stdin
# (uart_console keyboard thread + ringbuffer is already wired up). Used to
# trigger the onboarding tutorial via `onboarding` MSH cmd.
CONFIG_RT_USING_FINSH=y
CONFIG_FINSH_USING_HISTORY=y
CONFIG_FINSH_HISTORY_LINES=5
CONFIG_FINSH_USING_SYMTAB=y
CONFIG_FINSH_USING_DESCRIPTION=y
CONFIG_FINSH_THREAD_PRIORITY=20
CONFIG_FINSH_THREAD_STACK_SIZE=4096
CONFIG_FINSH_CMD_SIZE=80
CONFIG_FINSH_USING_MSH=y
CONFIG_FINSH_USING_MSH_DEFAULT=y
CONFIG_FINSH_ARG_MAX=10
CONFIG_USING_CPU_USAGE_PROFILER=n
# CMSIS-NN is ARM-only (uses arm_math.h)
CONFIG_BSP_USING_CMSIS_NN=n
# Data service framework: keep on so datac_open/close link as stubs; the
# actual cross-CPU pipe needs HWMAILBOX (off) and won't be exercised on PC.
CONFIG_BSP_USING_DATA_SVC=y
CONFIG_BSP_ALARM_MAX=8
# FlashDB: use LIBC file mode (no MTD on PC)
# CONFIG_PKG_FDB_USING_AUTO_MODE is not set
CONFIG_PKG_FDB_USING_FILE_LIBC_MODE=y
# TFLite Micro doesn't compile on MSVC (zero-size arrays in test_helpers.cpp)
CONFIG_PKG_USING_ARDUINO_TENSORFLOW_LITE_MICRO=n
CONFIG_PKG_USING_TENSORFLOW_LITE_MICRO_CMSISNN=n
# Inference modules need TFLite — turn off
CONFIG_BSP_USING_AIR_MOUSE=n
CONFIG_BSP_USING_GESTURE_RECOGNITION=n
# EZIPA needs HW EPIC HAL — ARM-only
CONFIG_USING_EZIPA_DEC=n
CONFIG_LV_USE_EZIP=n
# BLE/BT host stack uses ipc_queue (HCPU<->LCPU) — ARM-only
CONFIG_RT_USING_BLUETOOTH=n
CONFIG_BLUETOOTH=n
CONFIG_BSP_BLE_ANCS=n
# AMS (Apple Media Service) is the iOS counterpart of ANCS — same BLE-only
# coupling (bf0_ble_gap.h / ams_service.h live under middleware/bluetooth/include,
# which the PC build does not add). Mirror the ANCS-off lines so neither
# ams_service.c nor the BSP_BLE_AMS #ifdef bodies pull the BLE stack on PC.
CONFIG_BSP_BLE_AMS=n
CONFIG_BSP_USING_AMS_SVC=n
CONFIG_BT_FINSH=n
CONFIG_BT_PROFILE_CUSTOMIZE=n
CONFIG_CFG_HFP_HF=n
CONFIG_BSP_USING_ANCS_SVC=n
CONFIG_BSP_USING_BLE_LOG=n
CONFIG_BSP_USING_BLE_DEVICE_MANAGER=n
CONFIG_BSP_USING_BLE_HID=n
# BLOC providers tied to BLE/control surfaces
# CONTROL/SKAIWALK/NOTIFY blocs: declarations referenced unconditionally from
# message list layout etc., re-enable so headers are visible (BLE-using bodies
# are guarded by RT_USING_BLUETOOTH inside).
CONFIG_BSP_USING_BLOC_CONTROL=y
CONFIG_BSP_USING_BLOC_SKAIWALK=y
CONFIG_BSP_USING_BLOC_NOTIFY=y
# Communicate module: keep on so commu_send_*/parse_* link. The actual BLE
# write path is guarded by commu_can_send() which checks BLE state — without
# bluetooth, sends just no-op at runtime.
CONFIG_BSP_USING_COMMUNICATE=y
CONFIG_BSP_USING_COMM_BOND=y
CONFIG_BSP_USING_COMM_CONTROL=y
CONFIG_BSP_USING_COMM_HEALTH=y
CONFIG_BSP_USING_COMM_NOTIFY=y
CONFIG_BSP_USING_COMM_SETTING=y
CONFIG_BSP_USING_COMM_SKAILINK=y
CONFIG_BSP_USING_COMM_DFU=n
# Power management uses ARM-only drivers (drv_psram, drv_ext_dma, etc.)
CONFIG_BSP_USING_PM=n
CONFIG_BSP_PM_DEBUG=n
CONFIG_GUI_APP_PM=n
# Re-enable BLOC + model + UI handler — gui_apps/watch_demo.c reference their
# providers/types extensively. We'll guard ARM-specific pieces in the .c files.
# BLOC kept on. BLE-specific blocs (BSP_USING_BLOC_SKAIWALK already off above
# since it pulls bf0_ble; BSP_USING_BLOC_V2T off because it talks to LCPU svc).
CONFIG_BSP_USING_BLOC=y
CONFIG_BSP_USING_BLOC_FLASH=y
CONFIG_BSP_USING_BLOC_CALENDAR=y
CONFIG_BSP_USING_BLOC_SETTING=y
# BLOC_V2T: voice-to-text via WebRTC VAD + LCPU audio service — PC sim
# can't satisfy either, so off
CONFIG_BSP_USING_BLOC_V2T=n
CONFIG_BSP_USING_BLOC_PERIPHERAL=y
CONFIG_BSP_USING_BLOC_WEATHER=y
CONFIG_BSP_USING_BLOC_MOTION_TRACKING=y
CONFIG_BSP_USING_BLOC_FILESYSTEM=y
CONFIG_BSP_USING_BLOC_SYSTEM_PERCEPTION=y
CONFIG_BSP_USING_BLOC_EXERCISE=y
CONFIG_BSP_USING_IMU_CLIENT=y
CONFIG_BSP_USING_HR_CLIENT=y
CONFIG_BSP_USING_WATCH_SYS_CLIENT=y
CONFIG_BSP_USING_ALARM_CLIENT=y
CONFIG_BSP_USING_MODEL_WATCH_GLOBAL_DATA=y
CONFIG_BSP_USING_MODEL_WATCH_SYS_INTERACT=y
CONFIG_BSP_USING_UI_HANDLER=y
CONFIG_BSP_USING_GESTURE_HANDLER=y
CONFIG_BSP_USING_ALARM_MANAGER_SVC=y
CONFIG_BSP_USING_AUDIO_PROCESSOR=n
# Virtual console wraps a real UART HAL — meaningless on PC
CONFIG_BSP_USING_VIRTUAL_CONSOLE=n
CONFIG_BSP_USING_TOUCH_STATE_MANAGER=y
CONFIG_BSP_SHARE_PREFS=y
CONFIG_GUI_APP_FRAMEWORK=y
# Audio stack — codecs, DSP — ARM only on this SDK
CONFIG_AUDIO=n
CONFIG_PKG_USING_LIBHELIX=n
CONFIG_PKG_USING_WEBRTC=n
CONFIG_PKG_LIB_OPUS=n
# LVGL GIF uses app_cache_alloc from gui_apps/mem (excluded from PC build)
CONFIG_LV_USE_GIF=n
# QR code & freetype/fsdrv similar — no functional consumer in PC stub
# LV_USE_QRCODE: re-enable since interact app calls lv_qrcode_create unconditionally
CONFIG_LV_USE_QRCODE=y
# Trans-animation: use OVERWRITE (also 0-buffer) instead of NONE.
# NONE gates out lvsf_gesture entirely (left-edge swipe-back detect bar).
# CONFIG_APP_TRANS_ANIMATION_NONE is not set
CONFIG_APP_TRANS_ANIMATION_OVERWRITE=y
